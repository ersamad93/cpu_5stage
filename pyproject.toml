[project]
name = "cpu_5stage"
version = "0.1.0"
description = "5-Stage Pipelined CPU Verilog problem for HUD evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cocotb>=1.8.0",
    "cocotb-tools>=1.8.0",
    "pytest>=7.0.0",
    "pytest-xdist>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
